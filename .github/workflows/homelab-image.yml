name: Homelab image

# Builds the headless image for the home registry. Pull requests only test, build and
# verify. Runs from main also publish, which needs the SMS OIDC policy for this repository,
# ref, event and workflow. Publishing requests a release only when asked to: through the
# release input of a manual run, or the HOMELAB_RELEASE_ON_PUSH variable for pushes. The
# rollout order is in the harness runbook, docs/runbooks/egress-proxy.md.
on:
  pull_request:
    branches: [main]
    paths:
      - .cargo/**
      - .github/actions/setup-rust/**
      - .github/workflows/homelab-image.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile.headless
      - catalog/**
      - crates/**
      - rust-toolchain.toml
      - tools/**
  push:
    branches: [main]
    paths:
      - .cargo/**
      - .github/actions/setup-rust/**
      - .github/workflows/homelab-image.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile.headless
      - catalog/**
      - crates/**
      - rust-toolchain.toml
      - tools/**
  workflow_dispatch:
    inputs:
      release:
        description: Request the central egress release after publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: homelab-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_HOST: registry.homelab.robinjoon.xyz
  IMAGE_NAME: apps/agentgateway
  IMAGE_TAG: sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
  BASE_VERSION: 1.7.0-homelab
  # The harness revision whose gateway configuration and CA bundle the image is verified
  # against. Pinned so that a harness change cannot silently change this check.
  HARNESS_CONFIG_REVISION: 1007fa9286e75a5b4f2e5291382a4e9a0eb51546

jobs:
  policy:
    name: Check workflow policy
    if: github.repository == 'robinjoon-homelab/agentgateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the workflow policy test
        run: python3 tools/test_homelab_image_workflow.py

  regression:
    name: Run dynamic CA and CONNECT regression tests
    needs: policy
    if: github.repository == 'robinjoon-homelab/agentgateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # One job at a time limits peak memory; rustc has been killed for memory on smaller hosts.
      CARGO_BUILD_JOBS: "1"
      CARGO_TEST: cargo test --locked -p agentgateway --no-default-features --features crypto-aws-lc,jemalloc,mimalloc --profile quick-release
    steps:
      - name: Check out the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Run the unit tests
        run: |
          $CARGO_TEST --lib -- dynamic_ca test_target_ dynamic_backend_guard_covers
      - name: Run the integration tests
        run: |
          $CARGO_TEST --test integration -- connect:: tls:: dfp::

  build:
    name: Build and verify (${{ matrix.arch }})
    needs: [policy, regression]
    if: github.repository == 'robinjoon-homelab/agentgateway'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the image version
        id: metadata
        run: echo "version=${BASE_VERSION}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # One build exports the archive to publish and the Docker image to verify.
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.headless
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: false
          outputs: |
            type=oci,dest=image.tar
            type=docker,name=agentgateway-verify:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=homelab-image-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=homelab-image-{0}', matrix.arch) || '' }}
          provenance: false
          sbom: false
      - name: Check that the verified image is the archived image
        run: |
          set -euo pipefail
          manifest="$(tar -xOf image.tar index.json | jq -er '.manifests | if length == 1 then .[0].digest else error("expected one manifest") end')"
          config="$(tar -xOf image.tar "blobs/sha256/${manifest#sha256:}" | jq -er '.config.digest')"
          archived="$(tar -xOf image.tar "blobs/sha256/${config#sha256:}" | jq -ec '.rootfs.diff_ids')"
          loaded="$(docker image inspect --format '{{json .RootFS.Layers}}' "agentgateway-verify:${GITHUB_SHA}" | jq -ec '.')"
          if [[ "$archived" != "$loaded" ]]; then
            echo "::error::The Docker image and the OCI archive have different layers."
            exit 1
          fi
      - name: Check out the deployed gateway configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: robinjoon-homelab/Simple-K3S-Herness
          ref: ${{ env.HARNESS_CONFIG_REVISION }}
          path: harness
          persist-credentials: false
      - name: Verify the image before publication
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: tools/verify_headless_image.sh "agentgateway-verify:${GITHUB_SHA}" "$VERSION" "$GITHUB_SHA" harness
      - name: Save the verified image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: image.tar
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish and request release
    needs: build
    if: >-
      github.repository == 'robinjoon-homelab/agentgateway' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: homelab-image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-*
          path: images
      - name: Install the publishing tools
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          skopeo --version
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # SMS must trust this repository, workflow, ref and event first.
      - name: Load registry credentials through GitHub OIDC
        uses: robinjoon-homelab/Simple-K3S-Herness/.github/actions/load-ci-secrets@v1.0.0
        with:
          app: zot
      - name: Load harness credentials through GitHub OIDC
        uses: robinjoon-homelab/Simple-K3S-Herness/.github/actions/load-ci-secrets@v1.0.0
        with:
          app: harness
      - name: Validate platform credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in REGISTRY_USERNAME REGISTRY_PASSWORD HARNESS_ACTIONS_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::SMS did not provide ${name}; check the platform OIDC policy."
              exit 1
            fi
          done
      - name: Log in to the home registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Publish the verified images and their index
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          repository="${REGISTRY_HOST}/${IMAGE_NAME}"
          manifest_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '.digest'
          }

          sources=()
          expected=()
          for arch in amd64 arm64; do
            archive="images/image-${arch}/image.tar"
            digest="$(tar -xOf "$archive" index.json | jq -er '.manifests | if length == 1 then .[0].digest else error("expected one manifest") end')"
            skopeo copy --retry-times 3 --preserve-digests "oci-archive:${archive}" "docker://${repository}:${IMAGE_TAG}-${arch}"
            if [[ "$(manifest_digest "${repository}:${IMAGE_TAG}-${arch}")" != "$digest" ]]; then
              echo "::error::The registry changed the ${arch} digest."
              exit 1
            fi
            sources+=("${repository}@${digest}")
            expected+=("linux/${arch} ${digest}")
          done

          docker buildx imagetools create --tag "${repository}:${IMAGE_TAG}" "${sources[@]}"
          index="$(manifest_digest "${repository}:${IMAGE_TAG}")"
          if [[ ! "$index" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The registry returned an invalid index digest."
            exit 1
          fi
          actual="$(docker buildx imagetools inspect "${repository}@${index}" --format '{{json .Manifest}}' \
            | jq -er '.manifests[] | "\(.platform.os)/\(.platform.architecture) \(.digest)"' | sort)"
          if [[ "$actual" != "$(printf '%s\n' "${expected[@]}" | sort)" ]]; then
            echo "::error::The published index does not contain exactly the verified images."
            exit 1
          fi

          docker run --rm "${repository}@${index}" --version | grep -qF "\"git_revision\": \"${GITHUB_SHA}\""
          echo "digest=$index" >> "$GITHUB_OUTPUT"
          echo "Published \`${repository}:${IMAGE_TAG}\` as \`${index}\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Request the central egress release
        if: inputs.release == true || (github.event_name == 'push' && vars.HOMELAB_RELEASE_ON_PUSH == 'true')
        env:
          GH_TOKEN: ${{ env.HARNESS_ACTIONS_TOKEN }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          gh workflow run release-central-egress-image.yml \
            --repo robinjoon-homelab/Simple-K3S-Herness \
            --ref main \
            -f digest="$IMAGE_DIGEST" \
            -f source_revision="$GITHUB_SHA"
